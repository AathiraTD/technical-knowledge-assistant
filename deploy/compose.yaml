# A production-shaped stack: the application, PostgreSQL with pgvector, and
# Ollama. Three services because three are needed; nothing here is present to
# look like infrastructure.
#
#   cp deploy/.env.example deploy/.env      # then set POSTGRES_PASSWORD
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml exec app python -m eval.run
#
# The first command is not optional: POSTGRES_PASSWORD has no default, so
# `up` fails on a missing variable rather than starting a database with a
# password someone committed. The index builds itself as part of `up`.
#
# Inside the network, services are reached by their names — db:5432 and
# ollama:11434 — never localhost, which inside a container is the container.
#
# Index initialization completes before the UI starts. See the knowledge
# pipeline runbook for scheduled refreshes and verification boundaries.

name: lime-green-assistant

x-application: &application
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    ASSISTANT_POSTGRES_DSN: postgresql://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-assistant}
    OLLAMA_HOST: http://ollama:11434
    EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
    EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1024}
    GENERATION_MODEL: ${GENERATION_MODEL:-qwen3.5:4b}
  volumes:
    # The corpus is bind-mounted, not a named volume. A named volume starts
    # empty, so the indexer had nothing to index and the stack came up serving
    # an empty knowledge store — the failure looked like a model problem and was
    # a mount problem. Mounting the repository's own data directory also means
    # the shipped embedding cache is the one used, so a first build takes
    # seconds rather than re-embedding 552 passages inside a CPU container.
    #
    # It is read-write because the crawler archives each fetched original by
    # content hash under data/cache/versions, and a refresh cannot do that on a
    # read-only mount.
    #
    # A real deployment would keep named volumes and seed them from a release
    # artefact; this is the assessment shape, where the corpus ships with the
    # code and being able to inspect what the container built is worth more.
    - ../data:/app/data
    - ../data/staff:/app/data/staff:ro

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not exposed to the host by default. Uncomment only to inspect it with a
    # local client; the application reaches it over the compose network.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      # Readiness, not liveness: the server answering is not the same as the
      # database being there to serve.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-assistant}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Pulls the two models once, then exits. Keeping this separate from the app
  # means a restart of the app does not re-check a 4 GB download, and a failed
  # pull is visible as a failed service rather than a slow start.
  model-init:
    image: ollama/ollama:0.12.3
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull ${GENERATION_MODEL:-qwen3.5:4b}
        ollama pull ${EMBED_MODEL:-qwen3-embedding:0.6b}
        echo "models ready"
    restart: "no"

  index-init:
    <<: *application
    command: ["python", "-m", "assistant.indexing.index"]
    depends_on:
      db:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    restart: "no"

  app:
    <<: *application
    depends_on:
      index-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD-SHELL", "python -m assistant.health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
  ollama-models:
